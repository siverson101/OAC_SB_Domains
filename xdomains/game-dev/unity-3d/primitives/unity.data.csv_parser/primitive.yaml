id: unity.data.csv_parser
name: CSV Parser Utility
engine: Unity
language: C#
category: data
status: extracted
genre_tags:
- all
summary: A robust and standalone CSV parser for Unity, handling reading, writing, custom separators, and
  string escaping.
when_to_use:
- When you need to parse static CSV data exported from Excel or Google Sheets into your game without adding
  large external libraries.
- When dealing with CSV files that contain escaped commas inside strings (e.g., '"Hello, World!", 123').
when_not_to_use:
- If you need extremely high-performance JSON serialization instead (CSV is inherently string-based and
  generates garbage on parsing).
requires:
  components: []
  scene_objects: []
  primitives: []
provides:
  events: []
  state: []
config_schema: {}
compatible_primitives: []
conflicts_with: []
setup_steps:
- Place CsvParser.cs in your project.
- Instantiate `using (var parser = new CsvParser(stream)) { var data = parser.GetListCsvData(); }`
test_plan:
- Create a CSV file containing `123, "A string, with a comma"`.
- Parse it with CsvParser and verify the second column is not split into two pieces.
failure_modes:
- Attempting to load large CSV files directly using string paths on Android without using UnityWebRequest
  (since streaming assets are inside a jar).
code_files:
- CsvParser.cs
source_repo: https://github.com/CragonGame/CasinosClient
license: MIT
