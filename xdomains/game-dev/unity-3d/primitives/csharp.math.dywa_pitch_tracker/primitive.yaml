summary: A pure C# port of the dywapitchtrack algorithm by Antoine Schmitt, optimized for zero-allocation
  loops via cached WorkingBuffers. Used for real-time time-domain pitch tracking using wavelets.
when_to_use:
- When you need to analyze microphone input or raw audio samples to determine the pitch/frequency (e.g.,
  karaoke, rhythm games, or voice-controlled mechanics).
when_not_to_use:
- When you only need simple volume detection (RMS).
