id: csharp.threading.disruptor
name: Disruptor Ring Buffer
engine: Unity
language: C#
category: threading
status: extracted
genre_tags:
- threading
- performance
- networking
- jobs
summary: 'A pure C# implementation of the Disruptor pattern: a lock-free ring buffer for thread-safe data
  transfer utilizing cache-line padded longs to prevent false sharing.'
when_to_use:
- When passing high-frequency data (like network packets or job results) between exactly two distinct
  threads (Single Producer, Single Consumer) without locks or mutexes.
when_not_to_use:
- When single-threaded (use a standard RingBuffer). When you have multiple producers or multiple consumers
  (requires a different synchronization primitive).
